<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adavya Premiere - Admin Panel</title>
    <meta name="description" content="Admin panel for Adavya Premiere freshers event. Track and manage student points in real-time." />
    <meta name="author" content="Adavya Premiere" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#150e0e" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:title" content="Adavya Premiere - Admin Panel" />
    <meta property="og:description" content="Freshers event point tracking system" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>

    <!--
      Turbulence filter backing the .liquid-glass utility. Defined once for
      the whole app; elements that never use the class simply ignore it.
    -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <filter id="liquid-glass" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
